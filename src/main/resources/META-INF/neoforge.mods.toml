modLoader = "javafml"
loaderVersion = "[3,)"
license = "MIT"
issueTrackerURL = "https://github.com/Ap4kG/SpeedrunTimer/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Speedrun Timer"
authors = "Ap4k"
iconFile = "speedruntimer.png"
description = '''
Клиентский таймер спидранов: RTA и IGT в углу экрана.

RTA идёт по реальному времени, IGT тикает только когда мир работает.
Позиция меняется перетаскиванием при открытом чате.
Настройки: config/speedruntimer-client.toml
Клавиши по умолчанию: F8 - сброс/старт, F9 - пауза, F10 - скрыть/показать.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[26.3.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[26.3,)"
ordering = "NONE"
side = "CLIENT"
